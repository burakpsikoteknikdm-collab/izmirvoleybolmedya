<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sosyal Medya Kiti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--ink:#0b1f4d;--deep:#06122e;--blue:#1e4fd8;--sky:#eaf1ff;--gold:#ffc21a;--gold-d:#e5a800;--muted:#5b6b8c;--line:#d6e0f5;--red:#d92d20}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',system-ui,sans-serif;background:#f6f9ff;color:var(--ink);min-height:100vh}
h1,h2,.tab,.btn{font-family:'Barlow Condensed',sans-serif}

/* Uygulama düzeni */
.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 20px;position:sticky;top:0;z-index:5}
.top img{width:44px;height:44px}
.top h1{font-size:1.5rem;font-weight:800;line-height:1}
.top h1 i{font-style:normal;color:var(--gold)}
.top small{display:block;color:#9db8ff;font-weight:600;font-size:.8rem}
.stripe{height:5px;background:linear-gradient(90deg,var(--blue) 0 34%,var(--gold) 34% 67%,#fff 67%)}
.app{display:grid;grid-template-columns:380px minmax(0,1fr);gap:24px;max-width:1400px;margin:0 auto;padding:20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;align-self:start;position:sticky;top:90px;max-height:calc(100vh - 110px);overflow:auto}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tab{border:2px solid var(--line);background:var(--sky);color:var(--ink);border-radius:10px;padding:9px 6px;font-size:1.05rem;font-weight:700;cursor:pointer;line-height:1.1}
.tab small{display:block;font-family:'Barlow',sans-serif;font-size:.72rem;font-weight:600;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab[aria-pressed="true"] small{color:var(--gold)}
.f{margin-bottom:12px}
.f label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.f input[type=text],.f input[type=number],.f textarea,.f select{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font:500 1rem 'Barlow',sans-serif;color:var(--ink);background:#fbfcff}
.f textarea{resize:vertical;min-height:70px}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,79,216,.15)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 70px;gap:10px}
.file{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.row>*{min-width:0}
.file input{font-size:.8rem;width:100%}
.file button{border:none;background:none;color:var(--red);font-weight:700;cursor:pointer;font-size:.85rem}
.chk{display:flex;align-items:center;gap:8px;font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--blue)}
input[type=range]{width:100%;accent-color:var(--blue)}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;padding:13px;font-size:1.25rem;font-weight:800;cursor:pointer;background:var(--gold);color:var(--ink)}
.btn:hover{background:var(--gold-d)}
.btn:disabled{opacity:.6;cursor:wait}
.hint{font-size:.8rem;color:var(--muted);margin-top:8px;text-align:center}
.stage{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.stage .meta{font-size:.85rem;color:var(--muted);font-weight:600}
.scaler{transform-origin:top left;width:1080px}
.frame{position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(11,31,77,.25);border-radius:6px}

/* ===== Paylaşım görselleri (gerçek boyut: 1080px genişlik) ===== */
.p{position:relative;width:1080px;height:1350px;overflow:hidden;color:#fff;font-family:'Barlow Condensed',sans-serif;background:var(--deep)}
.p.story{height:1920px}
.p .bg{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}
.p .bg.empty{background:radial-gradient(900px 700px at 85% 10%,#1e4fd8 0%,rgba(30,79,216,0) 70%),radial-gradient(800px 600px at 0% 100%,#123a9c 0%,rgba(18,58,156,0) 70%),linear-gradient(160deg,#0b1f4d 0%,#06122e 100%)}
.p .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,18,46,.75) 0%,rgba(6,18,46,.2) 22%,rgba(6,18,46,.35) 45%,rgba(6,18,46,.94) 72%,#06122e 100%)}
.p .mark{position:absolute;width:900px;height:900px;right:-260px;top:120px;opacity:.06}
.p .bar5{position:absolute;left:0;right:0;top:0;height:14px;background:linear-gradient(90deg,#1e4fd8 0 34%,#ffc21a 34% 67%,#fff 67%)}
.p .head{position:absolute;left:60px;right:60px;top:56px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.p .brand{display:flex;align-items:center;gap:18px}
.p .brand img{width:118px;height:118px}
.p .brand b{display:block;font-size:50px;font-weight:800;line-height:.95;letter-spacing:.5px}
.p .brand b i{font-style:normal;color:#ffc21a}
.p .brand small{display:block;font-family:'Barlow',sans-serif;font-size:22px;font-weight:600;color:#9db8ff;letter-spacing:2px;margin-top:6px}
.p .lig{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:12px 28px;font-size:30px;font-weight:700;letter-spacing:1px;max-width:440px;text-align:center;line-height:1.1}
.p .foot{position:absolute;left:0;right:0;bottom:0;height:96px;background:#ffc21a;color:#0b1f4d;display:flex;align-items:center;justify-content:space-between;padding:0 60px;font-size:34px;font-weight:800;letter-spacing:.5px}
.p .foot span{display:flex;align-items:center;gap:12px}
.p .foot svg{width:34px;height:34px}
.kicker{display:inline-block;background:#ffc21a;color:#0b1f4d;font-size:46px;font-weight:900;font-style:italic;letter-spacing:1px;padding:6px 30px 4px;transform:skewX(-10deg)}
.kicker>span{display:inline-block;transform:skewX(10deg)}
.kicker.red{background:#d92d20;color:#fff}

/* Takım bloğu */
.team{display:flex;flex-direction:column;align-items:center;gap:22px;width:330px;text-align:center}
.tlogo{width:210px;height:210px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 8px rgba(255,255,255,.18);color:#0b1f4d;font-size:84px;font-weight:900}
.tlogo .im{width:84%;height:84%;background-size:contain;background-position:center;background-repeat:no-repeat}
.tname{font-size:52px;font-weight:800;line-height:1;text-shadow:0 3px 12px rgba(0,0,0,.4)}
.tname.win{color:#ffc21a}

/* Maç sonucu */
.sonuc .mid{position:absolute;left:0;right:0;bottom:150px;display:flex;flex-direction:column;align-items:center;gap:34px}
.sonuc .vsrow{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.score{font-size:250px;font-weight:900;line-height:.8;display:flex;align-items:center;gap:22px;color:#fff;min-width:330px;justify-content:center;padding-top:10px}
.score .w{color:#ffc21a}
.score em{font-style:normal;font-size:120px;color:rgba(255,255,255,.5)}
.sets{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:960px}
.sets b{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.28);border-radius:12px;padding:8px 20px;font-size:38px;font-weight:700;letter-spacing:1px}
.sets b i{font-style:normal;color:#ffc21a}
.datel{font-family:'Barlow',sans-serif;font-size:28px;font-weight:600;color:#c9d8ff;letter-spacing:1px}

/* Maç günü */
.macgunu .mid{position:absolute;left:0;right:0;bottom:150px;display:flex;flex-direction:column;align-items:center;gap:40px}
.vs{font-size:150px;font-weight:900;font-style:italic;color:#ffc21a;width:260px;text-align:center;line-height:1}
.info{display:flex;gap:16px;justify-content:center;width:960px}
.info div{flex:1;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);border-radius:16px;padding:16px 10px;text-align:center}
.info small{display:block;font-family:'Barlow',sans-serif;font-size:22px;font-weight:700;color:#9db8ff;letter-spacing:2px}
.info b{display:block;font-size:46px;font-weight:800;line-height:1.1;margin-top:4px}
.live{display:flex;align-items:center;gap:16px;background:#d92d20;border-radius:999px;padding:12px 34px 12px 22px;font-size:36px;font-weight:800;letter-spacing:.5px}
.live .dot{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 0 0 7px rgba(255,255,255,.3)}
.live span{font-family:'Barlow',sans-serif;font-weight:600;font-size:28px;opacity:.9}

/* Haber */
.haber .photo{position:absolute;left:0;right:0;top:0;height:780px;background-size:cover}
.haber .photo.empty{background:radial-gradient(700px 500px at 80% 20%,#1e4fd8,rgba(30,79,216,0) 70%),linear-gradient(160deg,#0b1f4d,#06122e)}
.haber .photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,18,46,.7) 0%,rgba(6,18,46,0) 30%,rgba(6,18,46,0) 60%,#06122e 100%)}
.haber .body{position:absolute;left:60px;right:60px;top:700px;bottom:130px;display:flex;flex-direction:column;gap:26px}
.haber h2{font-weight:800;line-height:1;letter-spacing:.3px}
.haber p{font-family:'Barlow',sans-serif;font-size:32px;font-weight:500;line-height:1.35;color:#c9d8ff}

/* Story */
.story .mid{position:absolute;left:0;right:0;top:330px;bottom:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
.story .team{width:600px}
.story .tlogo{width:260px;height:260px}
.story .tname{font-size:64px}
.story .vs{font-size:130px;width:auto}
.story .info{width:960px;flex-wrap:wrap}
.story .info div{flex:1 1 40%}
.story .info div.wide{flex-basis:100%}
.story .head{flex-direction:column;align-items:center;top:90px;gap:26px}
.story .brand{flex-direction:column;text-align:center;gap:14px}
.story .brand img{width:150px;height:150px}

@media (max-width:900px){
  .app{grid-template-columns:1fr;padding:16px}
  .panel{position:static;max-height:none}
  .top small{display:none}
}
</style>
</head>

gI41/h6AdLdJYalkEofZFVpkib5YSsTzr6SUnORq378oVJgqI//IACpbYFLYAAAAAAA==";
const SITE = "izmirvoleybolmedya.com";
const IG = "@izmirvoleybolmedya";
const varsayilan = {
  sablon:"sonuc", lig:"Kadınlar 2. Ligi", ev:"Göztepe", dep:"Efor Gençlik",
  skorEv:3, skorDep:0, setler:"25-18, 25-21, 25-16",
  tarih:"12 Ekim 2026", saat:"15.00", salon:"Karşıyaka Spor Salonu", canli:true,
  etiket:"SON DAKİKA", baslik:"Vodafone Sultanlar Ligi'nde İzmir'de çiçekli açılış",
  ozet:"Sezonun ilk iç saha maçında tribünler doldu, İzmir ekipleri taraftarı önünde sahaya çıktı.",
  fotoY:35
};
const metinAlanlari = ["lig","ev","dep","skorEv","skorDep","setler","tarih","saat","salon","etiket","baslik","ozet","fotoY"];
let durum = {...varsayilan};
const gorseller = {foto:null, evLogo:null, depLogo:null};
try { Object.assign(durum, JSON.parse(localStorage.getItem("ivm-kit")||"{}")); } catch(e){}

const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const up = s => esc(String(s??"").toLocaleUpperCase("tr-TR"));
const bas = s => String(s||"").trim().split(/\s+/).map(w=>w[0]||"").join("").slice(0,3).toLocaleUpperCase("tr-TR");

const igIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>';
const webIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>';

function bg(){
  const f = gorseller.foto;
  return f ? `<div class="bg" style="background-image:url(${f});background-position:center ${durum.fotoY}%"></div><div class="shade"></div>`
           : `<div class="bg empty"></div><img class="mark" src="${LOGO}" alt="">`;
}
function head(lig){
  return `<div class="bar5"></div><div class="head">
    <div class="brand"><img src="${LOGO}" alt=""><div><b>İZMİR VOLEYBOL<br><i>MEDYA</i></b><small>MEDYA GRUBU</small></div></div>
    ${lig ? `<div class="lig">${up(lig)}</div>` : ""}</div>`;
}
const foot = () => `<div class="foot"><span>${webIcon}${SITE}</span><span>${igIcon}${IG}</span></div>`;
function team(ad, logo, kazanan){
  return `<div class="team"><div class="tlogo">${logo ? `<div class="im" style="background-image:url(${logo})"></div>` : esc(bas(ad))}</div>
    <div class="tname${kazanan?" win":""}">${up(ad)}</div></div>`;
}
function bilgi(story){
  const k = [["TARİH",durum.tarih],["SAAT",durum.saat],["SALON",durum.salon]].filter(x=>String(x[1]||"").trim());
  return `<div class="info">${k.map(([a,b])=>`<div class="${story&&a==="SALON"?"wide":""}"><small>${a}</small><b>${up(b)}</b></div>`).join("")}</div>`;
}
const canli = () => durum.canli ? `<div class="live"><i class="dot"></i>CANLI YAYIN <span>YouTube · ${IG}</span></div>` : "";

const sablonlar = {
  sonuc(){
    const e = +durum.skorEv||0, d = +durum.skorDep||0;
    const sets = String(durum.setler||"").split(/[,;]/).map(s=>s.trim()).filter(Boolean);
    const yer = [durum.tarih, durum.salon].filter(Boolean).map(up).join("  ·  ");
    return `<div class="p sonuc">${bg()}${head(durum.lig)}
      <div class="mid">
        <div class="kicker"><span>MAÇ SONUCU</span></div>
        <div class="vsrow">${team(durum.ev,gorseller.evLogo,e>d)}
          <div class="score"><span class="${e>d?"w":""}">${e}</span><em>-</em><span class="${d>e?"w":""}">${d}</span></div>
          ${team(durum.dep,gorseller.depLogo,d>e)}</div>
        ${sets.length ? `<div class="sets">${sets.map(s=>`<b>${esc(s).replace(/[-–:]/,"<i>-</i>")}</b>`).join("")}</div>` : ""}
        ${yer ? `<div class="datel">${yer}</div>` : ""}
      </div>${foot()}</div>`;
  },
  macgunu(){
    return `<div class="p macgunu">${bg()}${head(durum.lig)}
      <div class="mid">
        <div class="kicker"><span>MAÇ GÜNÜ</span></div>
        <div class="vsrow" style="display:flex;align-items:center;justify-content:center">${team(durum.ev,gorseller.evLogo)}<div class="vs">VS</div>${team(durum.dep,gorseller.depLogo)}</div>
        ${bilgi(false)}${canli()}
      </div>${foot()}</div>`;
  },
  haber(){
    const b = String(durum.baslik||"");
    const boy = b.length < 45 ? 104 : b.length < 75 ? 88 : b.length < 110 ? 74 : 62;
    const f = gorseller.foto;
    return `<div class="p haber">
      <div class="photo${f?"":" empty"}" style="${f?`background-image:url(${f});background-position:center ${durum.fotoY}%`:""}"></div>
      ${f?"":`<img class="mark" src="${LOGO}" alt="" style="top:-80px">`}
      ${head("")}
      <div class="body">
        <div><div class="kicker${durum.etiket==="SON DAKİKA"?" red":""}"><span>${up(durum.etiket)}</span></div></div>
        <h2 style="font-size:${boy}px">${up(b)}</h2>
        ${durum.ozet ? `<p>${esc(durum.ozet)}</p>` : ""}
      </div>${foot()}</div>`;
  },
  story(){
    return `<div class="p story">${bg()}
      <div class="bar5"></div><div class="head">
        <div class="brand"><img src="${LOGO}" alt=""><div><b>İZMİR VOLEYBOL <i>MEDYA</i></b></div></div>
        ${durum.lig ? `<div class="lig">${up(durum.lig)}</div>` : ""}</div>
      <div class="mid">
        <div class="kicker"><span>MAÇ GÜNÜ</span></div>
        ${team(durum.ev,gorseller.evLogo)}<div class="vs">VS</div>${team(durum.dep,gorseller.depLogo)}
        ${bilgi(true)}${canli()}
      </div>${foot()}</div>`;
  }
};

function olcekle(){
  const p = $("poster").firstElementChild; if(!p) return;
  const w = 1080, h = p.offsetHeight;
  const alan = $("frame").parentElement.clientWidth;
  const maxH = durum.sablon==="story" ? window.innerHeight*0.85 : window.innerHeight*0.82;
  const s = Math.min(alan / w, Math.max(maxH, 420) / h, 1);
  $("scaler").style.transform = `scale(${s})`;
  $("frame").style.width = w*s+"px"; $("frame").style.height = h*s+"px";
  $("meta").textContent = `Önizleme %${Math.round(s*100)} · gerçek boyut 1080×${h}`;
}
function ciz(){
  $("poster").innerHTML = sablonlar[durum.sablon]();
  document.querySelectorAll("[data-for]").forEach(el => el.style.display = el.dataset.for.split(" ").includes(durum.sablon) ? "" : "none");
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-pressed", t.dataset.s===durum.sablon));
  olcekle();
  try { const k={sablon:durum.sablon,canli:durum.canli}; metinAlanlari.forEach(a=>k[a]=durum[a]); localStorage.setItem("ivm-kit", JSON.stringify(k)); } catch(e){}
}

metinAlanlari.forEach(a => { const el=$(a); el.value = durum[a]; el.addEventListener("input", () => { durum[a]=el.value; ciz(); }); });
$("canli").checked = !!durum.canli;
$("canli").addEventListener("change", e => { durum.canli = e.target.checked; ciz(); });
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { durum.sablon = t.dataset.s; ciz(); }));
document.querySelectorAll("[data-img]").forEach(inp => inp.addEventListener("change", () => {
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader(); r.onload = () => { gorseller[inp.dataset.img] = r.result; ciz(); }; r.readAsDataURL(f);
}));
document.querySelectorAll("[data-clear]").forEach(b => b.addEventListener("click", () => {
  gorseller[b.dataset.clear] = null; document.querySelector(`[data-img="${b.dataset.clear}"]`).value = ""; ciz();
}));
window.addEventListener("resize", olcekle);

$("indir").addEventListener("click", async () => {
  const btn = $("indir"); btn.disabled = true; btn.textContent = "Hazırlanıyor…";
  const sc = $("scaler"), eski = sc.style.transform;
  try {
    await document.fonts.ready;
    sc.style.transform = "none";
    const el = $("poster").firstElementChild;
    const canvas = await html2canvas(el, {scale:1, backgroundColor:"#06122e", width:1080, height:el.offsetHeight, windowWidth:1400, logging:false});
    const ad = ({sonuc:"mac-sonucu",macgunu:"mac-gunu",haber:"haber",story:"story"})[durum.sablon];
    const isim = [ad, durum.sablon==="haber" ? "" : `${durum.ev}-${durum.dep}`].filter(Boolean).join("-")
      .toLocaleLowerCase("tr-TR").replace(/ı/g,"i").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9]+/g,"-");
    const a = document.createElement("a"); a.download = `ivm-${isim}.png`; a.href = canvas.toDataURL("image/png"); a.click();
  } catch(e){ alert("Görsel oluşturulamadı: " + e.message); }
  finally { sc.style.transform = eski; btn.disabled = false; btn.textContent = "PNG İndir"; }
});

document.fonts.ready.then(olcekle);
ciz();
</script>
</body>
