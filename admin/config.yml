backend:
  name: github
  repo: burakpsikoteknikdm-collab/izmirvoleybolmedya
  branch: main
  base_url: https://www.izmirvoleybolmedya.com
  auth_endpoint: api/auth
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "haberler"
    label: "Haberler"
    folder: "content/haberler"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Haber Başlığı", name: "title", widget: "string" }
      - { label: "Yayın Tarihi", name: "date", widget: "datetime" }
      - { label: "Kapak Görseli", name: "image", widget: "image" }
      - label: "Ek Fotoğraflar (en fazla 3)"
        name: "galeri"
        widget: "list"
        required: false
        max: 3
        hint: "Kapak görseliyle birlikte en fazla 4 fotoğraf. Birden fazla fotoğraf varsa haberde kaydırmalı galeri olarak görünür."
        field: { label: "Fotoğraf", name: "foto", widget: "image" }
      - label: "Lig"
        name: "lig"
        widget: "select"
        required: false
        hint: "Seçerseniz haber, o ligin puan durumu ve fikstür sayfasının yanında da görünür (tüm gruplarda). Boş bırakılırsa sadece ana sayfada görünür."
        options:
          - { label: "Sultanlar Ligi", value: "sultanlar-ligi" }
          - { label: "Efeler Ligi", value: "efeler-ligi" }
          - { label: "Kadınlar 1. Ligi", value: "kadinlar-1-ligi" }
          - { label: "Erkekler 1. Ligi", value: "erkekler-1-ligi" }
          - { label: "Kadınlar 2. Ligi", value: "kadinlar-2-ligi" }
          - { label: "Erkekler 2. Ligi", value: "erkekler-2-ligi" }
      - label: "İzmir Takımlarımız"
        name: "bolum"
        widget: "select"
        required: false
        hint: "Seçerseniz haber, sitedeki \"İzmir Takımlarımız\" ya da \"Altyapı\" sekmesinde de görünür."
        options:
          - { label: "İzmir Takımlarımız – Takımlar", value: "takimlar" }
          - { label: "İzmir Takımlarımız – Altyapı", value: "altyapi" }
      - { label: "📌 Başa Tuttur", name: "sabit", widget: "boolean", default: false, required: false, hint: "İşaretlenirse haber manşette büyük olarak ve listede ilk sırada görünür. Hiçbir haber işaretli değilse en son haber öne çıkar." }
      - { label: "Haber İçeriği", name: "body", widget: "markdown" }

  - name: "canli_yayin"
    label: "Canlı Yayın & Skorlar"
    files:
      - file: "content/canli.json"
        label: "Canlı Yayın ve Fikstür Bilgileri"
        name: "canli_bilgi"
        fields:
          - { label: "Canlı Yayın YouTube Linki", name: "youtube_url", widget: "string" }
          - { label: "Günün Maç Skorları / Duyuru", name: "skor_duyuru", widget: "text" }

  - name: "kurumsal"
    label: "Kurumsal Sayfalar"
    files:
      - file: "content/sayfalar/hakkimizda.md"
        label: "Hakkımızda"
        name: "hakkimizda"
        fields:
          - { label: "Başlık", name: "title", widget: "string" }
          - { label: "Kısa Açıklama (sayfa üstünde ve Google'da görünür)", name: "description", widget: "text" }
          - { label: "Sayfa İçeriği", name: "body", widget: "markdown" }

  - name: "seritler"
    label: "Son Dakika & Reklam Şeridi"
    files:
      - file: "content/son-dakika.json"
        label: "Son Dakika Şeridi"
        name: "son_dakika"
        fields:
          - label: "Son Dakika Haberleri"
            name: "haberler"
            widget: "list"
            required: false
            hint: "Sitenin üstündeki kırmızı SON DAKİKA şeridinde kayar. Liste boşsa şeritte en son haber başlıkları kayar."
            summary: "{{fields.metin}}"
            fields:
              - { label: "Metin", name: "metin", widget: "string" }
              - { label: "Bağlantı (isteğe bağlı)", name: "link", widget: "string", required: false, hint: "https:// ile başlayan bir adres. Boş bırakılabilir." }
      - file: "content/reklam.json"
        label: "Reklam Şeridi"
        name: "reklam"
        fields:
          - { label: "Şerit Görünsün", name: "aktif", widget: "boolean", default: true }
          - { label: "Kayan Metin", name: "metin", widget: "text", hint: "Canlı yayın şeridinin altında kayar. Her satır ayrı bir mesaj olarak gösterilir." }
          - { label: "Tıklanınca Gidilecek Adres (isteğe bağlı)", name: "link", widget: "string", required: false, hint: "https://... ya da mailto:... ile başlamalı." }
